{{ define "main" }}
<article class="page">
  <div class="container container--narrow">
    {{ with .Params.parentApp }}
      <nav class="breadcrumb">
        <a href="{{ $.Parent.RelPermalink }}">&larr; {{ . }}</a>
      </nav>
    {{ end }}
    <h1 class="section__title">{{ .Title }}</h1>
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
