{{ define "main" }}
<article class="page">
  <div class="container container--narrow">
    <header class="section__header">
      <p class="eyebrow">About us</p>
      <h1 class="section__title">{{ .Title }}</h1>
      {{ with .Description }}<p class="section__lede">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
