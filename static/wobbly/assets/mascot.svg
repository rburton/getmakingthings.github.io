<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Wobbly mascot: bouncy pencil character, styled to match Mascot.imageset/mascot-1024.png -->
  <!-- Transparent background: drop onto any screen color. -->
  <!-- Style: heavy near-black outlines, big plain cartoon eyes (no glasses), -->
  <!-- slight playful tilt, white four-finger gloves, soft shading, purple scribble. -->
  <defs>
    <clipPath id="mouth">
      <path d="M348,378 Q400,456 452,378 Q400,404 348,378 Z"/>
    </clipPath>
    <!-- cartoon glove, pointing up, wrist at bottom -->
    <g id="glove">
      <!-- dark silhouette under-layer (outline + finger separations) -->
      <g stroke="#322E38" stroke-linecap="round">
        <line x1="-2" y1="12" x2="-30" y2="-40" stroke-width="32"/>
        <line x1="0" y1="12" x2="-2" y2="-52" stroke-width="32"/>
        <line x1="2" y1="12" x2="26" y2="-38" stroke-width="32"/>
        <line x1="-4" y1="20" x2="-44" y2="4" stroke-width="30"/>
      </g>
      <circle cx="0" cy="16" r="32" fill="#322E38"/>
      <!-- white core -->
      <g stroke="#FFFFFF" stroke-linecap="round">
        <line x1="-2" y1="12" x2="-30" y2="-40" stroke-width="22"/>
        <line x1="0" y1="12" x2="-2" y2="-52" stroke-width="22"/>
        <line x1="2" y1="12" x2="26" y2="-38" stroke-width="22"/>
        <line x1="-4" y1="20" x2="-44" y2="4" stroke-width="20"/>
      </g>
      <circle cx="0" cy="16" r="25" fill="#FFFFFF"/>
      <!-- cuff -->
      <rect x="-27" y="34" width="54" height="22" rx="11" fill="#FFFFFF" stroke="#322E38" stroke-width="7"/>
    </g>
  </defs>

  <!-- ground shadow (flat, world space) -->
  <ellipse cx="392" cy="760" rx="150" ry="18" fill="#000000" opacity="0.10"/>

  <!-- whole pencil + face + arms, tilted for a bouncy diagonal look -->
  <g transform="rotate(10 400 400)">
    <!-- waving left arm (behind body) -->
    <path d="M320,330 Q245,302 218,238" fill="none" stroke="#322E38" stroke-width="32" stroke-linecap="round"/>
    <path d="M320,330 Q245,302 218,238" fill="none" stroke="#F0A92E" stroke-width="17" stroke-linecap="round"/>
    <use href="#glove" transform="translate(200,197) rotate(-23)"/>
    <!-- right arm, out and down -->
    <path d="M480,360 Q556,388 582,448" fill="none" stroke="#322E38" stroke-width="32" stroke-linecap="round"/>
    <path d="M480,360 Q556,388 582,448" fill="none" stroke="#F0A92E" stroke-width="17" stroke-linecap="round"/>
    <use href="#glove" transform="translate(600,489) rotate(157)"/>

    <!-- eraser cap -->
    <path d="M312,152 L312,112 Q312,72 352,72 L448,72 Q488,72 488,112 L488,152 Z" fill="#FF8FAB" stroke="#322E38" stroke-width="9"/>
    <ellipse cx="368" cy="104" rx="22" ry="12" fill="#FFB3C7" transform="rotate(-18 368 104)"/>
    <rect x="316" y="134" width="168" height="14" fill="#000000" opacity="0.08"/>

    <!-- ferrule -->
    <rect x="304" y="152" width="192" height="50" rx="10" fill="#CBD2E0" stroke="#322E38" stroke-width="9"/>
    <rect x="312" y="165" width="176" height="5" rx="2.5" fill="#A9B2C6"/>
    <rect x="312" y="184" width="176" height="5" rx="2.5" fill="#A9B2C6"/>

    <!-- body with facet stripes + shading -->
    <rect x="312" y="202" width="176" height="360" fill="#FFC53D"/>
    <rect x="312" y="202" width="46" height="360" fill="#FFD66B"/>
    <rect x="442" y="202" width="46" height="360" fill="#F0A92E"/>
    <rect x="458" y="202" width="30" height="360" fill="#000000" opacity="0.07"/>
    <rect x="312" y="202" width="176" height="14" fill="#000000" opacity="0.10"/>
    <rect x="312" y="202" width="176" height="360" fill="none" stroke="#322E38" stroke-width="9"/>

    <!-- wood cone + dark gray graphite tip -->
    <path d="M312,562 L488,562 L400,722 Z" fill="#F6DCA9" stroke="#322E38" stroke-width="9" stroke-linejoin="round"/>
    <path d="M400,562 L488,562 L400,722 Z" fill="#000000" opacity="0.06"/>
    <path d="M366,660 L434,660 L400,722 Z" fill="#4F4F55" stroke="#322E38" stroke-width="7" stroke-linejoin="round"/>

    <!-- face: eyebrows + big plain eyes (no glasses) -->
    <path d="M334,248 Q364,230 394,249" fill="none" stroke="#322E38" stroke-width="12" stroke-linecap="round"/>
    <path d="M406,249 Q436,230 466,248" fill="none" stroke="#322E38" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="366" cy="306" rx="35" ry="45" fill="#FFFFFF"/>
    <ellipse cx="434" cy="306" rx="35" ry="45" fill="#FFFFFF"/>
    <ellipse cx="372" cy="314" rx="21" ry="27" fill="#2D2A4A"/>
    <ellipse cx="428" cy="314" rx="21" ry="27" fill="#2D2A4A"/>
    <circle cx="380" cy="300" r="8" fill="#FFFFFF"/>
    <circle cx="436" cy="300" r="8" fill="#FFFFFF"/>
    <circle cx="366" cy="328" r="4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="422" cy="328" r="4" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="366" cy="306" rx="35" ry="45" fill="none" stroke="#322E38" stroke-width="9"/>
    <ellipse cx="434" cy="306" rx="35" ry="45" fill="none" stroke="#322E38" stroke-width="9"/>

    <!-- big open smile with tongue (clipped inside the mouth) -->
    <path d="M348,378 Q400,456 452,378 Q400,404 348,378 Z" fill="#7C4A21" stroke="#322E38" stroke-width="8" stroke-linejoin="round"/>
    <ellipse cx="400" cy="420" rx="32" ry="15" fill="#FF8FAB" clip-path="url(#mouth)"/>
  </g>

  <!-- scribble it just drew, starting at the tilted tip (~344,717) -->
  <path d="M344,716 C296,742 274,700 308,700 C336,700 332,742 300,734 C266,726 372,766 486,726"
        fill="none" stroke="#5B4FE9" stroke-width="18" stroke-linecap="round"/>

  <!-- bounce sparkles -->
  <path d="M196,360 l7,16 16,7 -16,7 -7,16 -7,-16 -16,-7 16,-7 Z" fill="#FFD66B"/>
  <path d="M620,300 l6,14 14,6 -14,6 -6,14 -6,-14 -14,-6 14,-6 Z" fill="#FF8FAB"/>
</svg>
