<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Wobbly iOS app icon (light). Derived from mascot.svg, keep geometry in sync. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6CF6"/>
      <stop offset="1" stop-color="#4936D8"/>
    </linearGradient>
    <clipPath id="mouth">
      <path d="M352,376 Q400,448 448,376 Q400,400 352,376 Z"/>
    </clipPath>
    <!-- cartoon glove, pointing up, wrist at bottom (see docs/glove.png) -->
    <g id="glove">
      <g stroke="#322E38" stroke-linecap="round">
        <line x1="-2" y1="12" x2="-30" y2="-40" stroke-width="32"/>
        <line x1="0" y1="12" x2="-2" y2="-52" stroke-width="32"/>
        <line x1="2" y1="12" x2="26" y2="-38" stroke-width="32"/>
        <line x1="-4" y1="20" x2="-44" y2="4" stroke-width="30"/>
      </g>
      <circle cx="0" cy="16" r="32" fill="#322E38"/>
      <g stroke="#FFFFFF" stroke-linecap="round">
        <line x1="-2" y1="12" x2="-30" y2="-40" stroke-width="22"/>
        <line x1="0" y1="12" x2="-2" y2="-52" stroke-width="22"/>
        <line x1="2" y1="12" x2="26" y2="-38" stroke-width="22"/>
        <line x1="-4" y1="20" x2="-44" y2="4" stroke-width="20"/>
      </g>
      <circle cx="0" cy="16" r="25" fill="#FFFFFF"/>
      <rect x="-27" y="34" width="54" height="22" rx="11" fill="#FFFFFF" stroke="#322E38" stroke-width="7"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- faint floating letters -->
  <text x="120" y="300" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="260" fill="#FFFFFF" opacity="0.08">A</text>
  <text x="760" y="940" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="230" fill="#FFFFFF" opacity="0.08">b</text>
  <text x="780" y="280" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="200" fill="#FFFFFF" opacity="0.07">3</text>

  <!-- mascot, scaled up and tilted for bounce -->
  <g transform="rotate(-6 512 512) translate(-12 4) scale(1.31)">
    <!-- ground shadow -->
    <ellipse cx="400" cy="752" rx="150" ry="18" fill="#000000" opacity="0.16"/>

    <!-- waving left arm (behind body) -->
    <path d="M320,330 Q245,302 218,238" fill="none" stroke="#322E38" stroke-width="32" stroke-linecap="round"/>
    <path d="M320,330 Q245,302 218,238" fill="none" stroke="#F0A92E" stroke-width="17" stroke-linecap="round"/>
    <use href="#glove" transform="translate(200,197) rotate(-23)"/>
    <!-- right arm, out and down -->
    <path d="M480,360 Q556,388 582,448" fill="none" stroke="#322E38" stroke-width="32" stroke-linecap="round"/>
    <path d="M480,360 Q556,388 582,448" fill="none" stroke="#F0A92E" stroke-width="17" stroke-linecap="round"/>
    <use href="#glove" transform="translate(600,489) rotate(157)"/>

    <!-- eraser cap -->
    <path d="M312,152 L312,112 Q312,72 352,72 L448,72 Q488,72 488,112 L488,152 Z" fill="#FF8FAB" stroke="#322E38" stroke-width="9"/>
    <ellipse cx="368" cy="104" rx="22" ry="12" fill="#FFB3C7" transform="rotate(-18 368 104)"/>
    <rect x="316" y="134" width="168" height="14" fill="#000000" opacity="0.08"/>

    <!-- ferrule -->
    <rect x="304" y="152" width="192" height="50" rx="10" fill="#CBD2E0" stroke="#322E38" stroke-width="9"/>
    <rect x="312" y="165" width="176" height="5" rx="2.5" fill="#A9B2C6"/>
    <rect x="312" y="184" width="176" height="5" rx="2.5" fill="#A9B2C6"/>

    <!-- body with facet stripes + shading -->
    <rect x="312" y="202" width="176" height="360" fill="#FFC53D"/>
    <rect x="312" y="202" width="46" height="360" fill="#FFD66B"/>
    <rect x="442" y="202" width="46" height="360" fill="#F0A92E"/>
    <rect x="458" y="202" width="30" height="360" fill="#000000" opacity="0.07"/>
    <rect x="312" y="202" width="176" height="14" fill="#000000" opacity="0.10"/>
    <rect x="312" y="202" width="176" height="360" fill="none" stroke="#322E38" stroke-width="9"/>

    <!-- wood cone + dark gray graphite tip -->
    <path d="M312,562 L488,562 L400,722 Z" fill="#F6DCA9" stroke="#322E38" stroke-width="9" stroke-linejoin="round"/>
    <path d="M400,562 L488,562 L400,722 Z" fill="#000000" opacity="0.06"/>
    <path d="M366,660 L434,660 L400,722 Z" fill="#4F4F55" stroke="#322E38" stroke-width="7" stroke-linejoin="round"/>

    <!-- face: eyebrows, round glasses (thin frames), oval eyes -->
    <path d="M334,242 Q360,227 384,243" fill="none" stroke="#322E38" stroke-width="11" stroke-linecap="round"/>
    <path d="M416,243 Q440,227 466,242" fill="none" stroke="#322E38" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="362" cy="306" rx="34" ry="42" fill="#FFFFFF"/>
    <ellipse cx="438" cy="306" rx="34" ry="42" fill="#FFFFFF"/>
    <ellipse cx="366" cy="312" rx="13" ry="18" fill="#2D2A4A"/>
    <ellipse cx="434" cy="312" rx="13" ry="18" fill="#2D2A4A"/>
    <circle cx="371" cy="303" r="6" fill="#FFFFFF"/>
    <circle cx="439" cy="303" r="6" fill="#FFFFFF"/>
    <ellipse cx="362" cy="306" rx="34" ry="42" fill="none" stroke="#322E38" stroke-width="8"/>
    <ellipse cx="438" cy="306" rx="34" ry="42" fill="none" stroke="#322E38" stroke-width="8"/>
    <path d="M392,292 Q400,280 408,292" fill="none" stroke="#322E38" stroke-width="7" stroke-linecap="round"/>
    <line x1="312" y1="306" x2="328" y2="306" stroke="#322E38" stroke-width="7" stroke-linecap="round"/>
    <line x1="472" y1="306" x2="488" y2="306" stroke="#322E38" stroke-width="7" stroke-linecap="round"/>

    <!-- smile with tongue (clipped inside the mouth) -->
    <path d="M352,376 Q400,448 448,376 Q400,400 352,376 Z" fill="#7C4A21" stroke="#322E38" stroke-width="8" stroke-linejoin="round"/>
    <ellipse cx="400" cy="414" rx="30" ry="14" fill="#FF8FAB" clip-path="url(#mouth)"/>

    <!-- scribble it just drew (white pops on indigo) -->
    <path d="M398,716 C342,768 262,754 296,708 C316,682 366,692 352,726 C340,756 428,768 530,728"
          fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>

    <!-- bounce sparkles -->
    <path d="M196,360 l7,16 16,7 -16,7 -7,16 -7,-16 -16,-7 16,-7 Z" fill="#FFD66B"/>
    <path d="M612,300 l6,14 14,6 -14,6 -6,14 -6,-14 -14,-6 14,-6 Z" fill="#FF8FAB"/>
  </g>
</svg>
